<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Luxe Jewelry</title>
 <style>
    html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f8f9fa; display: flex; flex-direction: column; }
    header { background-color: #1a1a1a; color: #ffffff; padding: 20px 40px; width: 100%; box-sizing: border-box; }
    .container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    .card { background-color: #ffffff; padding: 40px; border-radius: 8px; border: 1px solid #e0e0e0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 500px; width: 100%; box-sizing: border-box; }
    h2 { margin-top: 0; color: #222; }
    .btn-home { display: inline-block; margin-top: 20px; background-color: #1a1a1a; color: #ffffff; padding: 12px 24px; border-radius: 5px; text-decoration: none; font-weight: bold; }
    .btn-home:hover { background-color: #333333; }
</style>
</head>
<body>

    <header>
        <h1>Luxe Jewelry</h1>
    </header>

    <div class="container">
        <h2>Thank You for Your Order! </h2>
        <p>Your purchase was successful and logged to the terminal.</p>
        <a href="/" class="btn-home">Return to Home</a>
    </div>

</body>
</html>
